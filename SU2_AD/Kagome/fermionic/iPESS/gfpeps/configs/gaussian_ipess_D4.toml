# Paths are relative to this file, independent of the shell working directory.
# Each chi starts from PBC; set job.warmstart explicitly to reuse an environment.
[job]
mode = "gaussian"
family = "ipess"
D = 4
input = "../../results/gfpeps_validation/ipess_D4"
output = "../../results/server/gaussian_ipess_D4"
blas_threads = 4

[ctm]
chi = [16, 32]
maxiter = 100
tol = 1e-7
cutoff = 1e-10
gauge_sweeps = 0
update_method = "continuous_update"
