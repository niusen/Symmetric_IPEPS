# Paths are relative to this file, independent of the shell working directory.
# Each chi starts from PBC; set job.warmstart explicitly to reuse an environment.
[job]
mode = "heisenberg"
family = "ipess"
D = 8
input = "../../results/gfpeps_validation/ipess_D8_seed12103"
output = "../../results/server/heisenberg_ipess_D8_seed12103"
blas_threads = 4

[ctm]
chi = [16, 32]
maxiter = 100
tol = 1e-7
cutoff = 1e-8
gauge_sweeps = 8
update_method = "continuous_update"
