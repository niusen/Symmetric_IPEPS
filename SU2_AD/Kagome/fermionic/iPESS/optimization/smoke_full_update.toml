[model]
t_up = 1.0
t_dn = 1.0
U = 2.0
mu = 0.1
centered = true

[run]
Lx = 1
Ly = 1
D_even = 1
D_odd = 1
D_max = 2
seed = 2
blas_threads = 1
resume = ""
output = "../results/smoke_full_update"

[optimization]
n_sweep = 1
use_gauge = true

[[schedule]]
tau = 0.01
dt = 0.01

[ctm]
chi = 2
iterations = 2
tol = 1e-7
measure = true
measurement_iterations = 4
