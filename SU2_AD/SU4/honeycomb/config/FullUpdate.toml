[run]
Lx = 4
Ly = 4
J = 1.0
Dmax = 9
# fixed_space: retain the INPUT irreps and their multiplicities on each bond.
# tensorkit: use native truncdim(Dmax), allowing these spaces to change.
space_policy = "fixed_space"
initial = "star"
blas_threads = 1
output_dir = "../server_runs/full_fixed_D9"

[[schedule]]
steps = 10
dt = 0.01

[ctm]
chi = 16
iterations = 100
tol = 1e-7

[optimizer]
maxiter = 20
gradient_tolerance = 1e-8
loss_tolerance = 1e-12
initial_step = 0.2
verbose = false
